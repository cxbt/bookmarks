{{ define "main" }}
<section class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">{{ .Title }}</h1>
    </div>
  </div>

  <div class="category-row" style="justify-content:flex-start">
    {{ range $name, $taxonomy := .Data.Terms.Alphabetical }}
      <span class="tag">
        {{ .Page.Title }} · {{ .Count }}
      </span>
    {{ else }}
      <div class="empty">No categories</div>
    {{ end }}
  </div>
</section>
{{ end }}
